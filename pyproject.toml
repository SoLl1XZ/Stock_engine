[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock_engine"
version = "0.1.0"
description = "Static stock-lookup site for US stocks, built from SEC EDGAR and yfinance data"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
